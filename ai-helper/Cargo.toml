[package]
name = "pymol-ai-assistant"
version = "0.32.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
description = "PyMOL AI-Assistant private local AI connection transport"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "io-util", "time"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
fs2 = "0.4"
tempfile = "3"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }

[dev-dependencies]
aws-lc-rs = "1.18.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
